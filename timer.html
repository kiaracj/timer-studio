  <meta charset="UTF-8">

  <title>Meditation Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&amp;display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
    .meditation-bg {
      background: linear-gradient(160deg, #fde4ef 0%, #f8cfe1 55%, #f2bed6 100%);
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      width: 100%;
    }
    .timer-text {
      font-variant-numeric: tabular-nums;
      text-shadow: 0 4px 30px rgba(138, 61, 99, 0.18);
      transition: color 1.5s ease;
      color: #8a3d63;
    }
    .pulse-active { animation: timerPulse 2s ease-in-out infinite; }
    .pulse-complete { animation: timerPulseRapid 0.6s ease-in-out infinite; }
    @keyframes timerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes timerPulseRapid {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .btn-primary, .btn-secondary {
      backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(138, 61, 99, 0.22);
    }
    .btn-primary:active, .btn-secondary:active { transform: translateY(0); }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.65);
      transform: translateY(-2px);
    }
    .btn-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary:disabled:hover { background: rgba(255, 255, 255, 0.45); }
    .session-label { letter-spacing: 0.25em; text-transform: uppercase; }
    .duration-btn {
      background: rgba(255, 255, 255, 0.5);
      color: #7a3255;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .duration-btn:hover {
      background: rgba(255, 255, 255, 0.72);
      transform: translateY(-2px);
    }
    .duration-btn:active { transform: translateY(0); }
    .duration-btn.active {
      background: #ffffff;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(138, 61, 99, 0.22);
    }
    .study-card {
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(138, 61, 99, 0.10);
      transition: all 0.3s ease;
    }
    .study-label {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(138, 61, 99, 0.62);
      line-height: 1.2;
    }
    .study-total {
      font-size: 24px;
      font-weight: 800;
      color: #8a3d63;
      font-variant-numeric: tabular-nums;
      line-height: 1.25;
      text-shadow: 0 2px 12px rgba(138, 61, 99, 0.12);
    }
    .study-reset {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(138, 61, 99, 0.75);
      background: transparent;
      border: 1px solid rgba(138, 61, 99, 0.25);
      border-radius: 9999px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .study-reset:hover {
      background: rgba(255, 255, 255, 0.75);
      border-color: rgba(138, 61, 99, 0.4);
      transform: translateY(-1px);
    }
    .study-reset:active { transform: translateY(0); }
    .study-reset:disabled { opacity: 0.35; cursor: default; transform: none; }
    .timer-ring {
      position: absolute;
      width: 352px;
      height: 352px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .timer-ring-outer {
      width: 418px;
      height: 418px;
      border-color: rgba(255, 255, 255, 0.3);
    }
    #timer-wrapper { transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    #timer-wrapper.timer-centered { position: relative; margin-bottom: 0 !important; }
    .exam-register-link {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.72);
      color: #8a3d63;
      box-shadow: 0 6px 18px rgba(138, 61, 99, 0.14);
      backdrop-filter: blur(12px);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }
    .exam-register-link svg { width: 16px; height: 16px; stroke-width: 2.2; }
    .exam-register-link:hover { background: rgba(255, 255, 255, 0.92); transform: translateY(-2px); box-shadow: 0 9px 22px rgba(138, 61, 99, 0.2); }
    .exam-register-link:active { transform: translateY(0); }
    :focus-visible { outline: 3px solid #8a3d63; outline-offset: 4px; }
    @media (max-width: 640px) {
      .timer-ring { width: 264px; height: 264px; }
      .timer-ring-outer { width: 319px; height: 319px; }
      #today-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        width: 100%;
        max-width: 360px;
        align-items: center;
        justify-content: stretch;
        gap: 14px 18px;
      }
      #today-card > div { min-width: 0; }
      #today-card > .study-reset { justify-self: end; }
    }
    @media (max-width: 380px) {
      #timer-display { font-size: 82px !important; }
      .timer-ring { width: 240px; height: 240px; }
      .timer-ring-outer { width: 290px; height: 290px; }
    }
  </style>

    <div class="flex gap-4 z-10 relative"><button id="start-btn" type="button" class="canva-button btn-primary px-8 py-3 rounded-full font-semibold transition-all" style="background: #ffffff; color: #8a3d63; font-weight: 600; font-size: 16px;" aria-label="Start"> <span data-template-id="start-button" class="canva-text" id="start-text" style="color: rgb(138, 61, 99); font-weight: 600; font-style: normal; font-size: 16px;">Start</span> <span data-template-id="pause-button" class="canva-text hidden" id="pause-text" style="color: rgb(138, 61, 99); font-weight: 600; font-style: normal; font-size: 16px;">Pause</span> <span data-template-id="resume-button" class="canva-text hidden" id="resume-text" style="color: rgb(138, 61, 99); font-weight: 600; font-style: normal; font-size: 16px;">Resume</span> </button> <button id="reset-btn" data-template-id="reset-button" type="button" class="canva-button btn-secondary px-8 py-3 rounded-full font-semibold transition-all" style="background: rgba(255, 255, 255, 0.45); color: rgb(138, 61, 99); font-weight: 600; font-style: normal; font-size: 16px;">Reset</button>
    </div>
    <div id="today-card" data-template-id="today-card" class="canva-card study-card relative z-10 mt-8 flex flex-wrap items-center justify-center gap-4 rounded-2xl px-5 py-3" style="background: rgba(255, 255, 255, 0.45);">
     <div class="flex flex-col items-start"><span data-template-id="study-label" class="canva-text study-label" style="color: rgba(138, 61, 99, 0.62); font-weight: 700; font-style: normal; font-size: 10px;">Study time today</span> <span data-template-id="today-total" id="today-total" class="canva-text study-total" style="color: rgb(138, 61, 99); font-weight: 800; font-size: 24px;">0m 00s</span>
     </div><button id="reset-today-btn" type="button" title="Reset today's total" class="canva-button study-reset" aria-label="Reset today's total"> <span data-template-id="reset-today-label" id="reset-today-label" style="color: rgba(138, 61, 99, 0.75); font-weight: 700; font-style: normal; font-size: 11px;">Reset</span> <span data-template-id="confirm-reset-today-label" id="confirm-reset-today-label" class="hidden" style="color: rgba(138, 61, 99, 0.75); font-weight: 700; font-style: normal; font-size: 11px;">Confirm reset?</span> </button>
     <div class="flex flex-col items-start"><span data-template-id="week-label" class="canva-text study-label" style="color: rgba(138, 61, 99, 0.62); font-weight: 700; font-style: normal; font-size: 10px;">Study time this week</span> <span data-template-id="week-total" id="week-total" class="canva-text study-total" style="color: rgb(138, 61, 99); font-weight: 800; font-size: 24px;">0m 00s</span>
     </div><button id="reset-week-btn" type="button" title="Reset week's total" class="canva-button study-reset" aria-label="Reset week's total"> <span data-template-id="reset-week-label" id="reset-week-label" style="color: rgba(138, 61, 99, 0.75); font-weight: 700; font-style: normal; font-size: 11px;">Reset</span> <span data-template-id="confirm-reset-week-label" id="confirm-reset-week-label" class="hidden" style="color: rgba(138, 61, 99, 0.75); font-weight: 700; font-style: normal; font-size: 11px;">Confirm reset?</span> </button>
     <div class="flex flex-col items-start"><span data-template-id="month-label" class="canva-text study-label" style="color: rgba(138, 61, 99, 0.62); font-weight: 700; font-style: normal; font-size: 10px;">Study time this month</span> <span data-template-id="month-total" id="month-total" class="canva-text study-total" style="color: rgb(138, 61, 99); font-weight: 800; font-size: 24px;">0m 00s</span>
     </div><button id="reset-month-btn" type="button" title="Reset month's total" class="canva-button study-reset" aria-label="Reset month's total"> <span data-template-id="reset-month-label" id="reset-month-label" style="color: rgba(138, 61, 99, 0.75); font-weight: 700; font-style: normal; font-size: 11px;">Reset</span> <span data-template-id="confirm-reset-month-label" id="confirm-reset-month-label" class="hidden" style="color: rgba(138, 61, 99, 0.75); font-weight: 700; font-style: normal; font-size: 11px;">Confirm reset?</span> </button>
     <div class="flex flex-col items-start"><span data-template-id="year-label" class="canva-text study-label" style="color: rgba(138, 61, 99, 0.62); font-weight: 700; font-style: normal; font-size: 10px;">Study time this year</span> <span data-template-id="year-total" id="year-total" class="canva-text study-total" style="color: rgb(138, 61, 99); font-weight: 800; font-size: 24px;">0m 00s</span>
     </div><button id="reset-year-btn" type="button" title="Reset year's total" class="canva-button study-reset" aria-label="Reset year's total"> <span data-template-id="reset-year-label" id="reset-year-label" style="color: rgba(138, 61, 99, 0.75); font-weight: 700; font-style: normal; font-size: 11px;">Reset</span> <span data-template-id="confirm-reset-year-label" id="confirm-reset-year-label" class="hidden" style="color: rgba(138, 61, 99, 0.75); font-weight: 700; font-style: normal; font-size: 11px;">Confirm reset?</span> </button>
    </div><a class="exam-register-link" href="esami.html" target="_blank" rel="noopener noreferrer" aria-label="Apri esami" title="Apri esami">

  <span>Esami</span>
</a>
   </div>
  </main>
  <script>
    if (window.lucide) { try { lucide.createIcons(); } catch (e) {} }

    const DEFAULT_MINUTES = 15;
    const STORAGE_KEY = 'study-timer-today-v1';
    const WEEK_STORAGE_KEY = 'study-timer-week-v1';
    const MONTH_STORAGE_KEY = 'study-timer-month-v1';
    const YEAR_STORAGE_KEY = 'study-timer-year-v1';

    const TICK_MS = 250;
    const LOCAL_SAVE_DEBOUNCE_MS = 2000;
    const SHEET_SYNC_DEBOUNCE_MS = 10000;

    let selectedDuration = DEFAULT_MINUTES * 60;
    let remainingSeconds = selectedDuration;
    let endTime = null;
    let timerInterval = null;
    let isRunning = false;
    let activeDate = todayStr();
    let todaySeconds = 0;
    let weekSeconds = 0;
    let weekKey = getWeekKey(new Date());
    let monthSeconds = 0;
    let monthKey = getMonthKey(new Date());
    let yearSeconds = 0;
    let yearKey = getYearKey(new Date());
    let confirmingTodayReset = false;
    let confirmingWeekReset = false;
    let confirmingMonthReset = false;
    let confirmingYearReset = false;
    let backendRecords = [];
    let sheetWriteQueue = Promise.resolve();
    let sheetReady = false;
    const createdKeys = new Set();
    let localSaveTimer = null;
    let sheetSyncTimer = null;

    const timerDisplay = document.getElementById('timer-display');
    const timerWrapper = document.getElementById('timer-wrapper');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const durationSelector = document.getElementById('duration-selector');
    const durationBtns = document.querySelectorAll('.duration-btn');
    const todayTotalEl = document.getElementById('today-total');
    const resetTodayBtn = document.getElementById('reset-today-btn');

    function todayStr() {
      const d = new Date();
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function getWeekKey(date) {
      const d = new Date(date);
      const day = d.getDay() || 7;
      d.setDate(d.getDate() - day + 1);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function getMonthKey(date) {
      const d = new Date(date);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }

    function getYearKey(date) {
      return String(new Date(date).getFullYear());
    }

    function loadTodayTotal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data && data.date === activeDate &&
            typeof data.seconds === 'number' && data.seconds >= 0) {
          todaySeconds = Math.floor(data.seconds);
        }
      } catch (e) {}
    }

    function loadWeekTotal() {
      try {
        const raw = localStorage.getItem(WEEK_STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data && data.week === weekKey && typeof data.seconds === 'number' && data.seconds >= 0) weekSeconds = Math.floor(data.seconds);
      } catch (e) {}
    }

    function loadMonthYearTotals() {
      try {
        const monthData = JSON.parse(localStorage.getItem(MONTH_STORAGE_KEY) || 'null');
        if (monthData && monthData.month === monthKey && typeof monthData.seconds === 'number' && monthData.seconds >= 0) monthSeconds = Math.floor(monthData.seconds);
        const yearData = JSON.parse(localStorage.getItem(YEAR_STORAGE_KEY) || 'null');
        if (yearData && yearData.year === yearKey && typeof yearData.seconds === 'number' && yearData.seconds >= 0) yearSeconds = Math.floor(yearData.seconds);
      } catch (e) {}
    }

    function saveLocalNow() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ date: activeDate, seconds: todaySeconds }));
        localStorage.setItem(WEEK_STORAGE_KEY, JSON.stringify({ week: weekKey, seconds: weekSeconds }));
        localStorage.setItem(MONTH_STORAGE_KEY, JSON.stringify({ month: monthKey, seconds: monthSeconds }));
        localStorage.setItem(YEAR_STORAGE_KEY, JSON.stringify({ year: yearKey, seconds: yearSeconds }));
      } catch (e) {}
    }

    function schedulePersist(immediate) {
      if (immediate) {
        if (localSaveTimer) { clearTimeout(localSaveTimer); localSaveTimer = null; }
        saveLocalNow();
        if (sheetReady && window.dataSdk) {
          if (sheetSyncTimer) { clearTimeout(sheetSyncTimer); sheetSyncTimer = null; }
          persistTotalsToSheet();
        }
        return;
      }
      if (!localSaveTimer) {
        localSaveTimer = setTimeout(() => { localSaveTimer = null; saveLocalNow(); }, LOCAL_SAVE_DEBOUNCE_MS);
      }
      if (sheetReady && window.dataSdk && !sheetSyncTimer) {
        sheetSyncTimer = setTimeout(() => { sheetSyncTimer = null; persistTotalsToSheet(); }, SHEET_SYNC_DEBOUNCE_MS);
      }
    }

    function persistTotalsToSheet() {
      if (!sheetReady || !window.dataSdk) return;
      const totals = [
        ['day', activeDate, todaySeconds],
        ['week', weekKey, weekSeconds],
        ['month', monthKey, monthSeconds],
        ['year', yearKey, yearSeconds]
      ];
      sheetWriteQueue = sheetWriteQueue.then(async () => {
        for (const [period_type, period_key, seconds] of totals) {
          const key = period_type + ':' + period_key;
          const existing = backendRecords.find(r => r.period_type === period_type && r.period_key === period_key);
          let result;
          if (existing) {
            result = await window.dataSdk.update({ ...existing, seconds });
          } else if (createdKeys.has(key)) {
            continue;
          } else {
            result = await window.dataSdk.create({ period_type, period_key, seconds });
            if (result && result.isOk) createdKeys.add(key);
          }
          if (!result || !result.isOk) continue;
          await new Promise(r => setTimeout(r, 500));
        }
      }).catch(() => {});
    }

    const sheetHandler = {
      onDataChanged(data) {
        backendRecords = Array.isArray(data) ? data : [];
        createdKeys.clear();
        const current = [
          ['day', activeDate], ['week', weekKey], ['month', monthKey], ['year', yearKey]
        ];
        current.forEach(([type, key]) => {
          const record = backendRecords.find(r => r.period_type === type && r.period_key === key);
          if (!record || typeof record.seconds !== 'number' || record.seconds < 0) return;
          if (type === 'day') todaySeconds = Math.floor(record.seconds);
          if (type === 'week') weekSeconds = Math.floor(record.seconds);
          if (type === 'month') monthSeconds = Math.floor(record.seconds);
          if (type === 'year') yearSeconds = Math.floor(record.seconds);
        });
        sheetReady = true;
        renderTodayTotal();
        saveLocalNow();
      }
    };

    function formatDuration(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      if (h > 0) return `${h}h ${String(m).padStart(2, '0')}m`;
      if (m > 0) return `${m}m ${String(s).padStart(2, '0')}s`;
      return `${s}s`;
    }

    function renderTodayTotal() {
      todayTotalEl.textContent = formatDuration(todaySeconds);
      document.getElementById('week-total').textContent = formatDuration(weekSeconds);
      document.getElementById('month-total').textContent = formatDuration(monthSeconds);
      document.getElementById('year-total').textContent = formatDuration(yearSeconds);
      resetTodayBtn.disabled = todaySeconds === 0;
      document.getElementById('reset-week-btn').disabled = weekSeconds === 0;
      document.getElementById('reset-month-btn').disabled = monthSeconds === 0;
      document.getElementById('reset-year-btn').disabled = yearSeconds === 0;
      if (todaySeconds === 0) showTodayResetConfirmation(false);
      if (monthSeconds === 0) showMonthResetConfirmation(false);
      if (yearSeconds === 0) showYearResetConfirmation(false);
    }

    function addSecondsToTotals(n) {
      if (!(n > 0)) return;
      const now = new Date();
      const newDate = todayStr();
      if (activeDate !== newDate) { activeDate = newDate; todaySeconds = 0; }
      const nWeek = getWeekKey(now);
      if (weekKey !== nWeek) { weekKey = nWeek; weekSeconds = 0; }
      const nMonth = getMonthKey(now);
      if (monthKey !== nMonth) { monthKey = nMonth; monthSeconds = 0; }
      const nYear = getYearKey(now);
      if (yearKey !== nYear) { yearKey = nYear; yearSeconds = 0; }
      todaySeconds += n;
      weekSeconds += n;
      monthSeconds += n;
      yearSeconds += n;
      renderTodayTotal();
      schedulePersist(false);
    }

    function showTodayResetConfirmation(show) {
      confirmingTodayReset = show;
      document.getElementById('reset-today-label').classList.toggle('hidden', show);
      document.getElementById('confirm-reset-today-label').classList.toggle('hidden', !show);
      resetTodayBtn.setAttribute('aria-label', show ? "Confirm reset of today's total" : "Reset today's total");
    }

    function showMonthResetConfirmation(show) {
      confirmingMonthReset = show;
      document.getElementById('reset-month-label').classList.toggle('hidden', show);
      document.getElementById('confirm-reset-month-label').classList.toggle('hidden', !show);
    }

    function showYearResetConfirmation(show) {
      confirmingYearReset = show;
      document.getElementById('reset-year-label').classList.toggle('hidden', show);
      document.getElementById('confirm-reset-year-label').classList.toggle('hidden', !show);
    }

    const resetMonthBtn = document.getElementById('reset-month-btn');
    resetMonthBtn.addEventListener('click', () => {
      if (monthSeconds === 0) return;
      if (!confirmingMonthReset) return showMonthResetConfirmation(true);
      monthSeconds = 0;
      showMonthResetConfirmation(false);
      schedulePersist(true);
      renderTodayTotal();
    });

    const resetYearBtn = document.getElementById('reset-year-btn');
    resetYearBtn.addEventListener('click', () => {
      if (yearSeconds === 0) return;
      if (!confirmingYearReset) return showYearResetConfirmation(true);
      yearSeconds = 0;
      showYearResetConfirmation(false);
      schedulePersist(true);
      renderTodayTotal();
    });

    const resetWeekBtn = document.getElementById('reset-week-btn');
    resetWeekBtn.addEventListener('click', () => {
      if (weekSeconds === 0) return;
      if (!confirmingWeekReset) {
        confirmingWeekReset = true;
        document.getElementById('reset-week-label').classList.add('hidden');
        document.getElementById('confirm-reset-week-label').classList.remove('hidden');
        return;
      }
      weekSeconds = 0;
      confirmingWeekReset = false;
      document.getElementById('reset-week-label').classList.remove('hidden');
      document.getElementById('confirm-reset-week-label').classList.add('hidden');
      schedulePersist(true);
      renderTodayTotal();
    });

    resetTodayBtn.addEventListener('click', () => {
      if (todaySeconds === 0) return;
      if (!confirmingTodayReset) {
        showTodayResetConfirmation(true);
        return;
      }
      activeDate = todayStr();
      todaySeconds = 0;
      schedulePersist(true);
      renderTodayTotal();
    });

    function showStartState(state) {
      document.getElementById('start-text').classList.toggle('hidden', state !== 'start');
      document.getElementById('pause-text').classList.toggle('hidden', state !== 'pause');
      document.getElementById('resume-text').classList.toggle('hidden', state !== 'resume');
      startBtn.setAttribute('aria-label', state.charAt(0).toUpperCase() + state.slice(1));
    }

    durationBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (isRunning) return;
        selectedDuration = parseInt(btn.dataset.minutes, 10) * 60;
        remainingSeconds = selectedDuration;
        timerWrapper.classList.remove('pulse-complete', 'timer-centered');
        durationBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        showStartState('start');
        updateDisplay();
      });
    });

    startBtn.addEventListener('click', () => {
      if (isRunning) pauseTimer();
      else startTimerSession();
    });
    resetBtn.addEventListener('click', reset);
    const defaultBtn = document.querySelector('[data-minutes="15"]');
    if (defaultBtn) defaultBtn.classList.add('active');

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function updateDisplay() {
      timerDisplay.textContent = formatTime(remainingSeconds);
    }

    let audioContext = null;
    function prepareAudio() {
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
      } catch (e) {}
    }

    function playCompletionTone() {
      try {
        if (!audioContext || audioContext.state !== 'running') return;
        const ctx = audioContext;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(528, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(396, ctx.currentTime + 1.2);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 1.5);
      } catch (e) {}
    }

    function onComplete() {
      isRunning = false;
      endTime = null;
      clearInterval(timerInterval);
      timerInterval = null;
      timerWrapper.classList.remove('pulse-active');
      timerWrapper.classList.add('pulse-complete');
      durationSelector.style.opacity = '1';
      durationSelector.style.pointerEvents = 'auto';
      showStartState('start');
      updateDisplay();
      schedulePersist(true);
      playCompletionTone();
    }

    function catchUp() {
      if (!isRunning || endTime === null) return false;
      const left = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
      const delta = remainingSeconds - left;
      if (delta > 0) {
        remainingSeconds = left;
        updateDisplay();
        addSecondsToTotals(delta);
      }
      return remainingSeconds <= 0;
    }

    function tick() {
      if (catchUp()) onComplete();
    }

    function startTimerSession() {
      if (remainingSeconds <= 0) return;
      prepareAudio();
      isRunning = true;
      endTime = Date.now() + remainingSeconds * 1000;
      timerWrapper.classList.remove('pulse-complete');
      timerWrapper.classList.add('pulse-active', 'timer-centered');
      durationSelector.style.opacity = '0';
      durationSelector.style.pointerEvents = 'none';
      showStartState('pause');
      clearInterval(timerInterval);
      timerInterval = setInterval(tick, TICK_MS);
    }

    function pauseTimer() {
      const done = catchUp();
      isRunning = false;
      endTime = null;
      clearInterval(timerInterval);
      timerInterval = null;
      timerWrapper.classList.remove('pulse-active');
      durationSelector.style.opacity = '1';
      durationSelector.style.pointerEvents = 'auto';
      if (done) { onComplete(); return; }
      showStartState('resume');
      schedulePersist(true);
    }

    function reset() {
      isRunning = false;
      endTime = null;
      clearInterval(timerInterval);
      timerInterval = null;
      remainingSeconds = selectedDuration;
      timerWrapper.classList.remove('pulse-active', 'pulse-complete', 'timer-centered');
      durationSelector.style.opacity = '1';
      durationSelector.style.pointerEvents = 'auto';
      showStartState('start');
      schedulePersist(true);
      updateDisplay();
    }

    window.addEventListener('pagehide', () => {
      if (isRunning) catchUp();
      schedulePersist(true);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        if (isRunning) catchUp();
        schedulePersist(true);
      } else {
        if (isRunning) tick();
      }
    });

    loadTodayTotal();
    loadWeekTotal();
    loadMonthYearTotals();
    renderTodayTotal();
    updateDisplay();
    (async () => {
      try {
        if (!window.dataSdk || typeof window.dataSdk.init !== 'function') return;
        const result = await window.dataSdk.init(sheetHandler);
        if (!result || !result.isOk) sheetReady = false;
      } catch (e) {
        sheetReady = false;
      }
    })();
  </script>
